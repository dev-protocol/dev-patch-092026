[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pin solc version for reproducible builds. Forge downloads automatically if not cached.
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# Silence missing-license / pragma noise from vendored interfaces
[profile.default.fmt]
line_length = 100

# Named RPC endpoints for fork tests. Any works; all are public.
[rpc_endpoints]
mainnet = "https://ethereum-rpc.publicnode.com"
llama = "https://eth.llamarpc.com"
ankr = "https://rpc.ankr.com/eth"
